[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-readiness-local"
version = "0.1.0"
description = "Evidence-backed local repository assessment, reporting and remediation workflows"
requires-python = ">=3.10"
dependencies = []
license-files = ["LICENSE", "LICENSE-SCOPE.md", "NOTICE.md"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
agent-readiness = "agent_readiness.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_readiness*"]

[tool.setuptools.package-data]
agent_readiness = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
